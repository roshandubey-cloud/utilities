name: test

on:
  push:
    paths:
      - 'sftp-loadtest/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'sftp-loadtest/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sftp-loadtest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: sftp-loadtest/go.sum
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        # -race catches data races on the hot dispatch + flush paths;
        # cheap on this codebase. -timeout matches the longest test
        # (mockserver integration) plus generous headroom for CI noise.
        run: go test -race -timeout 5m ./...
      # govulncheck gates merges on a vulnerability-free dependency
      # closure. We surfaced a real CVE (GO-2025-3487 in x/crypto) on
      # 2026-05-01 by running this; making it a CI step prevents
      # regressions when dependabot opens an update PR.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: $(go env GOPATH)/bin/govulncheck ./...
