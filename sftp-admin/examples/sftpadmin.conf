{
  "_comment": "Example sftpadmind config. JSON; comments via _comment keys (cJSON ignores anything we don't ask it about, so this is fine).",

  "paths": {
    "db_path":          "/var/lib/sftpadmin/sftpadmin.db",
    "hostkey_dir":      "/var/lib/sftpadmin/hostkeys",
    "master_key_file":  "/etc/sftpadmin/master.key",
    "run_dir":          "/run/sftpadmin",
    "log_file":         "/var/log/sftpadmin/sftpadmind.json"
  },

  "admin": {
    "bind_addr":             "127.0.0.1",
    "port":                  9443,
    "tls_cert":              "/etc/sftpadmin/admin-cert.pem",
    "tls_key":               "/etc/sftpadmin/admin-key.pem",
    "generate_self_signed":  true
  },

  "logging": {
    "level":  "info",
    "syslog": true
  },

  "security": {
    "_comment":      "argon2id parameters. Defaults aim for ~0.7s on a 2020 server core.",
    "argon2_ops":    3,
    "argon2_mem_kb": 65536
  },

  "sftp": {
    "default_max_sessions":          100,
    "default_max_sessions_per_user": 10,
    "default_idle_timeout_s":        600,
    "default_auth_grace_s":          30
  }
}
